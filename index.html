<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet" />
    <title>Rock Paper Scissor Game</title>
</head>

<body class="preload">
    <div class="score-bar">
        <img src="logo.svg" alt="logo" />
        <div class="score">
            <h5>SCORE</h5>
            <h3 class="score-num">0</h3>
        </div>
    </div>
    <section class="game">
        <button class="choice-btn" data-choice="paper">
				<div class="choice paper">
					<img src="icon-paper.svg" alt="paper" />
				</div>
			</button>
        <button class="choice-btn" data-choice="scissors">
				<div class="choice scissors">
					<img src="icon-scissors.svg" alt="scissors" />
				</div>
			</button>
        <button class="choice-btn" data-choice="rock">
				<div class="choice rock">
					<img src="icon-rock.svg" alt="rock" />
				</div>
			</button>
    </section>
    <section class="results hidden">
        <h2 class="results-heading">YOU PICKED</h2>
        <h2 class="results-heading">COMPUTER PICKED</h2>
        <div class="results-result"></div>
        <div class="result-winner hidden">
            <h3 class="results-text"></h3>
            <button class="play-again">PLAY AGAIN</button>
        </div>
        <div class="results-result"></div>
    </section>
    <button class="rules-btn" tabindex="1">RULES</button>
    <div class="backdrop">
        <div class="modal">
            <div class="title">
                <h3>RULES</h3>
                <svg class="cross" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
						<path
							fill="#3B4262"
							fill-rule="evenodd"
							d="M16.97 0l2.122 2.121-7.425 7.425 7.425 7.425-2.121 2.12-7.425-7.424-7.425 7.425L0 16.97l7.425-7.425L0 2.121 2.121 0l7.425 7.425L16.971 0z"
							opacity=".25" />
					</svg>
            </div>
            <img src="image-rules.svg" alt="" />
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
